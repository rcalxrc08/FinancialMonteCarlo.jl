name: Documentation
# Builds the documentation (Documenter) and publishes it with GitHub Pages, whose source is "GitHub Actions": the site is
# uploaded as the Pages artifact and deployed by actions/deploy-pages, with no gh-pages branch.
# The site root is the manual of master; stable/ is the manual of the latest release, built from its tag in the same
# run; docs/redirect/404.html sends the old URLs of the deploydocs site (dev/..., vX.Y.Z/...) to the root and to stable/.
# Pull requests only build the manual of master. A pushed tag starts this workflow on master (Pages does not deploy
# from a tag), whose run rebuilds stable/ from the new tag.
on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
concurrency:
  # one deployment at a time; a newer run waits for the one in progress
  group: docs
  cancel-in-progress: false
permissions:
  actions: write  # julia-actions/cache deletes the caches it replaces; publish-tag starts a run on master
  contents: read
  pages: write    # the Pages deployment
  id-token: write # the token of the Pages deployment
jobs:
  docs:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1' # docs/Project.toml finds the package through [sources], which needs Julia 1.11 or later
      - uses: julia-actions/cache@v3
      - name: Build the manual of master
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs --color=yes docs/make.jl
      - name: Find the latest release
        id: release
        if: github.event_name != 'pull_request'
        run: echo "tag=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Checkout the latest release
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release
      # Without GITHUB_REPOSITORY Documenter detects no deploy system, so the deploydocs of the make.jl of a release
      # before this workflow does nothing.
      - name: Build the manual of the latest release into stable/
        if: steps.release.outputs.tag != ''
        run: |
          julia --project=release/docs -e 'using Pkg; Pkg.instantiate()'
          env -u GITHUB_REPOSITORY julia --project=release/docs --color=yes release/docs/make.jl
          cp -r release/docs/build docs/build/stable
      - if: github.event_name != 'pull_request'
        run: cp docs/redirect/404.html docs/build/404.html
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build
  # A tag: publish from master (a workflow_dispatch started with GITHUB_TOKEN does start a run, unlike the other events).
  publish-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish from master
        run: gh workflow run Documentation.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  pages:
    needs: docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
