name: Benchmarks
# Runs benchmark/run.jl and writes its table to the summary of the job (and to the log). Timings on shared runners vary
# by 10-20% between runs: compare two commits within one run, or locally, before drawing conclusions.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      groups:
        description: 'Groups to run, separated by spaces (models methods payoffs markets greeks); empty for all'
        required: false
        default: ''
permissions:
  actions: write # julia-actions/cache deletes the caches it replaces
  contents: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Benchmarks - Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate
        run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - name: Run
        run: julia --project=benchmark --threads=auto benchmark/run.jl $GROUPS
        env:
          GROUPS: ${{ github.event.inputs.groups }}
